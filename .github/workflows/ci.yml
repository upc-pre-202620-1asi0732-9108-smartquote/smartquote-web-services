name: ci.yml
on:
  push:
    branches-ignore: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_call:

jobs:
  test:
    name: Build, unit, API/PostgreSQL and BDD tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Test complete purchasing workflow in isolated PostgreSQL
        shell: pwsh
        run: ./tests/run-tests.ps1 -Coverage
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.cobertura.xml
          if-no-files-found: error
